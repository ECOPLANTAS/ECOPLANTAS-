*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
.hero{padding:28px 0 18px}

.hero p{margin:0 0 22px;color:var(--muted);max-width:46ch;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 22px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;min-height:44px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
